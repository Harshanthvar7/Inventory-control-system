apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventrack-products
spec:
  replicas: 2
  selector:
    matchLabels:
      app: inventrack-products
  template:
    metadata:
      labels:
        app: inventrack-products
    spec:
      containers:
      - name: inventrack-products
        image: lakshminarayananr0411/inventory-control-system:products-v1
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: inventrack-service
spec:
  type: NodePort
  selector:
    app: inventrack-products
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30007