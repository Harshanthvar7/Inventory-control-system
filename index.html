<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
        content="InvenTrack — A lightweight inventory control system for managing products and stock movements." />
  <title>InvenTrack — Home</title>
  <link rel="stylesheet" href="shared/style.css" />
</head>
<body>

  <!-- Nav bar injected by shared/nav.js -->
  <script src="shared/nav.js" defer></script>

  <main class="page-wrapper" id="main-content">
    <header class="page-header">
      <h1>Welcome to InvenTrack</h1>
      <p>Select a section from the navigation bar to get started.</p>
    </header>

    <!-- Module root — content injected by each page's module script -->
    <div id="module-root"></div>
  </main>

  <!-- Shared data layer (available globally as window.InvenTrack) -->
  <script src="shared/data.js"></script>

</body>
</html>
